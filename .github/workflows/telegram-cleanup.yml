name: Telegram Cleanup

on:
  workflow_dispatch:
    inputs:
      message_ids:
        description: "Comma-separated message ids to delete (e.g. 260,261,262)"
        required: true
        default: "260,261,262"

permissions:
  contents: read

jobs:
  delete:
    name: Delete Telegram messages
    runs-on: ubuntu-latest
    steps:
      - name: Delete messages
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IDS: ${{ github.event.inputs.message_ids }}
        run: |
          if [ -z "${BOT_TOKEN}" ] || [ -z "${CHAT_ID}" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets not set"
            exit 1
          fi
          for id in $(echo "${IDS}" | tr ',' ' '); do
            echo "Deleting message ${id}..."
            code=$(curl -s -o /tmp/tg_resp.json -w '%{http_code}' \
              -X POST "https://api.telegram.org/bot${BOT_TOKEN}/deleteMessage" \
              --form-string "chat_id=${CHAT_ID}" \
              --form-string "message_id=${id}")
            echo "HTTP ${code}: $(cat /tmp/tg_resp.json)"
            if [ "$code" != "200" ]; then
              echo "::warning::Failed to delete message ${id}"
            fi
          done
