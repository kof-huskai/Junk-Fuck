name: Telegram Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Send Telegram test message
    runs-on: ubuntu-latest
    steps:
      # Pure smoke test: exercises the exact sendMessage + sendDocument
      # calls used by the release notification, without releasing anything.
      - name: Send test message to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${BOT_TOKEN}" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN secret is not set - add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "${CHAT_ID}" ]; then
            echo "::error::TELEGRAM_CHAT_ID secret is not set - add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

          msg="🧹 <b>JunkFuck Telegram test</b> ✅

          The bot is working and connected to this channel!

          This message was sent from the <b>Telegram Test</b> GitHub Actions workflow - <a href=\"https://github.com/${GITHUB_REPOSITORY}/actions\">view it on GitHub</a>."

          curl --fail --silent --show-error \
            -F "chat_id=${CHAT_ID}" \
            -F "parse_mode=HTML" \
            -F "text=${msg}" \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage"

          # Also exercise the document path used by the release notification.
          printf 'JunkFuck Telegram test file\n' > test.txt
          caption="🧹 <b>JunkFuck Telegram test</b> - document upload works too ✅"
          curl --fail --silent --show-error \
            -F "chat_id=${CHAT_ID}" \
            -F "parse_mode=HTML" \
            -F "document=@test.txt" \
            -F "caption=${caption}" \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"

          echo "Telegram test message sent successfully."
