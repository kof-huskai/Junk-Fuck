name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build JunkFuck EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned Wails v3 CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.6

      - name: Build EXE (amd64)
        shell: bash
        run: |
          wails3 build VERSION="${GITHUB_SHA::8}"
          mv bin/JunkFuck.exe bin/JunkFuck-windows-amd64.exe

      - name: Build EXE (arm64)
        shell: bash
        run: |
          GOARCH=arm64 wails3 build VERSION="${GITHUB_SHA::8}"
          mv bin/JunkFuck.exe bin/JunkFuck-windows-arm64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JunkFuck-exe
          path: bin/*.exe
          if-no-files-found: error
