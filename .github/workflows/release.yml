name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  check:
    name: Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet + Test
        run: |
          go vet ./...
          go test ./...

  build:
    name: Production build (amd64)
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build production EXE
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          wails build -clean -skipbindings -ldflags "-X main.Version=${VERSION}"

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem build/bin/*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii build/bin/SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: build/bin/
          if-no-files-found: error

  release:
    name: GitHub Release + Telegram
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/JunkFuck.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false

      # Rich Telegram distribution: one clean HTML announcement plus the
      # freshly built EXE attached to the channel.
      # Secrets (optional): TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.
      # continue-on-error keeps the GitHub Release green even if Telegram
      # is down - the release is the source of truth, Telegram is extra.
      - name: Send release to Telegram
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          if [ -z "${BOT_TOKEN}" ] || [ -z "${CHAT_ID}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets not set - skipping Telegram notification."
            exit 0
          fi

          msg="🧹 <b>JunkFuck Desktop ${TAG} released!</b>

          A native Windows desktop build is out - no Python required:

          🖥️ <b>Windows</b> — <a href=\"https://github.com/${REPO}/releases/download/${TAG}/JunkFuck.exe\">Download EXE</a>

          📦 <a href=\"${RELEASE_URL}\">View release on GitHub</a>

          ⚠️ SmartScreen may warn about the unsigned EXE — click <b>More info</b> → <b>Run anyway</b>. It's the same open-source code you can read in the repo."

          curl --fail --silent --show-error \
            --form-string "chat_id=${CHAT_ID}" \
            --form-string "parse_mode=HTML" \
            --form-string "text=${msg}" \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            || echo "::warning::Failed to send announcement to Telegram"

          for file in dist/*.exe; do
            [ -e "${file}" ] || continue
            curl --fail --silent --show-error \
              --form-string "chat_id=${CHAT_ID}" \
              --form-string "parse_mode=HTML" \
              -F "document=@${file}" \
              --form-string "caption=🧹 <b>JunkFuck Desktop ${TAG}</b> - Windows EXE" \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
              || echo "::warning::Failed to send ${file} to Telegram"
          done
