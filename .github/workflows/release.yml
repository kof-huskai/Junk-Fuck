name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  check:
    name: Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Format check
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet + Test
        shell: bash
        run: |
          go vet ./...
          go test ./...

  build:
    name: Production build
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned Wails v3 CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.6

      # VERSION is injected into main.Version via -ldflags, so the app and
      # the in-app updater report the exact tagged release version. Two
      # architectures are built (amd64 + arm64) and renamed to
      # JunkFuck-windows-<arch>.exe — the Wails v3 updater's default asset
      # matcher selects its artifact by matching "windows" + arch in the
      # filename.
      - name: Build production EXE (amd64)
        shell: bash
        run: |
          wails3 build VERSION="${GITHUB_REF_NAME#v}"
          mv bin/JunkFuck.exe bin/JunkFuck-windows-amd64.exe

      - name: Build production EXE (arm64)
        shell: bash
        run: |
          GOARCH=arm64 wails3 build VERSION="${GITHUB_REF_NAME#v}"
          mv bin/JunkFuck.exe bin/JunkFuck-windows-arm64.exe

      # sha256sum-style sidecar. The updater's github provider is configured
      # with ChecksumAsset="SHA256SUMS" (exact asset name, no .txt) and parses
      # "<hex>  <basename>" lines to verify the downloaded artifact.
      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem bin/*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii bin/SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: bin/
          if-no-files-found: error

  release:
    name: GitHub Release + Telegram
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist

      # One user-oriented release summary is prepared here and used by both
      # GitHub (body_path below) and the Telegram announcement, so the two
      # surfaces always tell the same story instead of drifting apart.
      # The Telegram step further below mirrors a condensed version of these
      # same highlights — keep the two lists in sync when features change.
      - name: Prepare release notes
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cat > release-body.md <<'EOF'
          # JunkFuck v${VER}

          A polished native Windows build of the deep junk scanner & cleaner.

          ## What's new
          - Hidden files and folders are now handled correctly during scans
          - JetBrains Mono typography across the application
          - Refined Windows-style curved Sidebar with subtle separation
          - Live update status in the Sidebar

          ## Improved
          - Results layout, scrolling and equal category cards
          - Scanner and update workflow polish

          ## Safety
          - Hidden content still passes through backend protection and candidate validation
          - Cleanup remains backend-enforced: only scanned candidates can ever be deleted

          ## Windows
          - x64 and ARM64 portable executables
          EOF
          sed -i "s/\${VER}/${VER}/g" release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/JunkFuck-windows-amd64.exe
            dist/JunkFuck-windows-arm64.exe
            dist/SHA256SUMS
          body_path: release-body.md
          draft: false
          prerelease: false

      # Rich Telegram distribution: one clean HTML announcement plus the
      # freshly built EXE attached to the channel. Telegram is only a
      # distribution layer — GitHub Releases remain the update source of
      # truth (the in-app updater reads them directly).
      # Secrets (optional): TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.
      - name: Send release to Telegram
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "${BOT_TOKEN}" ] || [ -z "${CHAT_ID}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets not set - skipping Telegram notification."
            exit 0
          fi

          VER="${TAG#v}"
          # Defensive HTML escaping: tag names are controlled by us, but a
          # bad tag must never be able to break Telegram markup or inject
          # entities into the payload.
          ESC_TAG=$(printf '%s' "${TAG}" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"
          AMD64_URL="https://github.com/${REPO}/releases/download/${TAG}/JunkFuck-windows-amd64.exe"
          ARM64_URL="https://github.com/${REPO}/releases/download/${TAG}/JunkFuck-windows-arm64.exe"

          cat > /tmp/jf-release-msg.html <<EOF
          🧹 <b>JunkFuck ${ESC_TAG}</b> — Windows

          A new native Windows build is ready.

          ✨ <b>What's new</b>
          • Hidden files and folders are now handled correctly during scans
          • JetBrains Mono typography across the application
          • Refined Windows-style curved Sidebar with subtle separation
          • Live update status in the Sidebar

          🛠 <b>Improved</b>
          • Results layout and scrolling
          • Scanner and update workflow polish

          🛡 <b>Safety</b>
          Hidden content still passes through backend protection and candidate validation. Cleanup stays backend-enforced — only scanned candidates can ever be deleted.

          🖥 <b>Windows</b>
          • x64 — <a href="${AMD64_URL}">Download EXE</a>
          • ARM64 — <a href="${ARM64_URL}">Download EXE</a>

          📦 <a href="${RELEASE_URL}">View release on GitHub</a>

          #JunkFuck #Release
          EOF

          curl --fail --silent --show-error \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text@/tmp/jf-release-msg.html" \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            || echo "::warning::Failed to send the JunkFuck release announcement to Telegram"

          # The SAME built artifacts from the GitHub Release are delivered
          # here — no separate Telegram rebuild, so binaries can never differ
          # between the two distribution surfaces.
          for file in dist/*.exe; do
            [ -e "${file}" ] || continue
            name="$(basename "${file}")"
            case "${name}" in
              *amd64*) arch="Windows x64" ;;
              *arm64*) arch="Windows ARM64" ;;
              *) arch="Windows" ;;
            esac
            curl --fail --silent --show-error \
              --form-string "chat_id=${CHAT_ID}" \
              --form-string "parse_mode=HTML" \
              -F "document=@${file}" \
              --form-string "caption=🧹 <b>JunkFuck ${ESC_TAG}</b> — ${arch}" \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
              || echo "::warning::Failed to send ${file} to Telegram"
          done

          if [ -f dist/SHA256SUMS ]; then
            curl --fail --silent --show-error \
              --form-string "chat_id=${CHAT_ID}" \
              -F "document=@dist/SHA256SUMS" \
              --form-string "caption=SHA256 checksums — JunkFuck ${ESC_TAG}" \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
              || echo "::warning::Failed to send SHA256SUMS to Telegram"
          fi
