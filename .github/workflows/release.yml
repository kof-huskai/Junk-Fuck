name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  check:
    name: Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Format check
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet + Test
        shell: bash
        run: |
          go vet ./...
          go test ./...

  build:
    name: Production build
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned Wails v3 CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.6

      # VERSION is injected into main.Version via -ldflags, so the app and
      # the in-app updater report the exact tagged release version. Two
      # architectures are built (amd64 + arm64) and renamed to
      # JunkFuck-windows-<arch>.exe — the Wails v3 updater's default asset
      # matcher selects its artifact by matching "windows" + arch in the
      # filename.
      - name: Build production EXE (amd64)
        shell: bash
        run: |
          wails3 build VERSION="${GITHUB_REF_NAME#v}"
          mv bin/JunkFuck.exe bin/JunkFuck-windows-amd64.exe

      - name: Build production EXE (arm64)
        shell: bash
        run: |
          GOARCH=arm64 wails3 build VERSION="${GITHUB_REF_NAME#v}"
          mv bin/JunkFuck.exe bin/JunkFuck-windows-arm64.exe

      # sha256sum-style sidecar. The updater's github provider is configured
      # with ChecksumAsset="SHA256SUMS" (exact asset name, no .txt) and parses
      # "<hex>  <basename>" lines to verify the downloaded artifact.
      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem bin/*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii bin/SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: bin/
          if-no-files-found: error

  release:
    name: GitHub Release + Telegram
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/JunkFuck-windows-amd64.exe
            dist/JunkFuck-windows-arm64.exe
            dist/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: false

      # Rich Telegram distribution: one clean HTML announcement plus the
      # freshly built EXE attached to the channel. Telegram is only a
      # distribution layer — GitHub Releases remain the update source of
      # truth (the in-app updater reads them directly).
      # Secrets (optional): TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.
      - name: Send release to Telegram
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          if [ -z "${BOT_TOKEN}" ] || [ -z "${CHAT_ID}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets not set - skipping Telegram notification."
            exit 0
          fi

          # Double-quoted string + $NL so ${TAG}/${REPO} actually expand
          # (the old $'...' ANSI-C quoting only converted \n to newlines and
          # left ${VARS} literal — Telegram received "${TAG}" verbatim).
          NL=$'\n'
          msg="🧹 <b>JunkFuck ${TAG} released!</b>${NL}${NL}A native Windows desktop build is out - no Python required:${NL}${NL}🖥️ <b>Windows x64</b> — <a href=\"https://github.com/${REPO}/releases/download/${TAG}/JunkFuck-windows-amd64.exe\">Download EXE</a>${NL}🖥️ <b>Windows ARM64</b> — <a href=\"https://github.com/${REPO}/releases/download/${TAG}/JunkFuck-windows-arm64.exe\">Download EXE</a>${NL}${NL}📦 <a href=\"${RELEASE_URL}\">View release on GitHub</a>${NL}${NL}⚠️ SmartScreen may warn about the unsigned EXE — click <b>More info</b> → <b>Run anyway</b>. It's the same open-source code you can read in the repo."

          curl --fail --silent --show-error \
            --form-string "chat_id=${CHAT_ID}" \
            --form-string "parse_mode=HTML" \
            --form-string "text=${msg}" \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            || echo "::warning::Failed to send announcement to Telegram"

          for file in dist/*.exe; do
            [ -e "${file}" ] || continue
            curl --fail --silent --show-error \
              --form-string "chat_id=${CHAT_ID}" \
              --form-string "parse_mode=HTML" \
              -F "document=@${file}" \
              --form-string "caption=🧹 <b>JunkFuck ${TAG}</b> - $(basename "$file")" \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
              || echo "::warning::Failed to send ${file} to Telegram"
          done
