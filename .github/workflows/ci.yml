name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Go + frontend checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The Go binary embeds the built frontend (go:embed frontend/dist),
      # so the frontend must be built before any Go compile/test step.
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Format check
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        shell: bash
        run: go vet ./...

      - name: Test
        shell: bash
        run: go test ./...
