[project]
name = "junkfuck"
version = "3.0.0"
description = "Deep C: Drive junk scanner & cleaner for Windows"
requires-python = ">=3.8"
dependencies = ["colorama"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
# Lint set is explicit so CI behaves identically on every ruff version:
# ruff's classic default (E4/E7/E9/F) plus import sorting (I).
# E722: bare `except:` is used deliberately across junkfuck.py for defensive
# error handling on OS-level calls. Real errors are never silently hidden.
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E722"]
